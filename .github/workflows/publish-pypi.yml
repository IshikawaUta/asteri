name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Hanya aktif saat Anda menekan tag versi seperti v3.0.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Build and Upload Release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    # Permission 'id-token: write' wajib untuk otentikasi PyPI OIDC Trusted Publishing (tanpa password/token)
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build Source Distribution (sdist)
      # Membangun Source Distribution (sdist) agar module C-Extension dikompilasi secara otomatis di mesin end-user
      run: python -m build --sdist

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Autentikasi via PyPI Trusted Publishing OIDC (tanpa password/token);
        # environment "pypi" harus dikonfigurasi dengan OIDC Trusted Publisher di PyPI.
        skip-existing: true
