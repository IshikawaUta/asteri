name: CodSpeed Performance Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run CodSpeed Benchmarks
    runs-on: ubuntu-latest
    # id-token: write is required for OIDC authentication with CodSpeed.
    # Scoping it to this job follows GitHub's least-privilege guidance.
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-codspeed
        pip install -e .

    - name: Verify the C fastparser extension is available
      run: python -c "from asteri.http import FAST_PARSER_AVAILABLE; assert FAST_PARSER_AVAILABLE, 'C fastparser extension not built'"

    - name: Run CodSpeed benchmarks
      uses: CodSpeedHQ/action@v5
      with:
        mode: simulation
        run: python -m pytest benchmarks/ --codspeed
