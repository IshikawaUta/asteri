name: CodSpeed Performance Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run CodSpeed Benchmarks
    runs-on: ubuntu-latest
    # id-token: write is required for OIDC authentication with CodSpeed.
    # Scoping it to this job follows GitHub's least-privilege guidance.
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-codspeed h2 gevent watchdog psutil

    - name: Run CodSpeed benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        run: python -m pytest benchmarks/ --codspeed
        mode: simulation
