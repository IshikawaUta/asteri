name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build psutil gevent watchdog h2
        pip install -e .
        pip install flask fastapi tornado gunicorn uvicorn
        pip install ruff mypy types-psutil types-setuptools pytest pytest-cov coverage

    - name: Run Ruff Static Analysis
      run: |
        ruff check .

    - name: Run Mypy Type Checking
      run: |
        mypy asteri tests --ignore-missing-imports

    - name: Verify CLI Version
      run: |
        asteri --version

    - name: Run Unit Tests with Coverage
      run: |
        pytest tests/ -q --cov=asteri --cov-report=xml:coverage.xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        fail_ci_if_error: false
        verbose: true

    - name: Run Full Regression Suite
      run: |
        chmod +x test_asteri_cli.sh
        ./test_asteri_cli.sh
