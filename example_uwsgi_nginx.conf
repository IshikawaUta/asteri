# Example Nginx configuration for Asteri using uWSGI protocol
# Run Asteri with: asteri example_wsgi:app -b 127.0.0.1:8000
# Note: Asteri automatically detects uWSGI protocol on the same port.

server {
    listen 80;
    server_name example.com;

    location / {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
    }

    # Asteri Status Dashboard (still accessible via HTTP)
    location /asteri-status {
        proxy_pass http://127.0.0.1:8000/asteri-status;
    }
}
