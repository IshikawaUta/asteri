codecov:
  require_ci_to_pass: true
  branch: main

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 100
        threshold: 0
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false
